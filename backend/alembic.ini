# Alembic configuration for the TourPie backend.
#
# IMPORTANT: No database URL is hardcoded here. The URL is resolved at runtime
# in alembic/env.py via app.database.build_postgres_url(), keeping a single
# source of truth for DATABASE_URL / DATABASE_* environment resolution.
# Alembic is a deploy-time tool only and is never imported by the application.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
version_path_separator = os

# Intentionally left blank; env.py injects the runtime URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
